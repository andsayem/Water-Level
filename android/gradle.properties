org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This machine has 14 CPU cores but only ~15GB RAM, and release builds
# (R8, resource shrinking) spawn one worker JVM per core by default -
# that many concurrent heaps is what's crashing release builds with
# native OOM. Cap it well below the core count.
org.gradle.workers.max=3
# Kotlin's incremental-compilation cache crashes when the pub cache (C:) and
# the project (D:) are on different drive roots (RelocatableFileToPathConverter
# can't compute a relative path across drives). Disable it until upstream fixes
# https://youtrack.jetbrains.com/issue/KT (relativeTo across Windows drive roots).
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
